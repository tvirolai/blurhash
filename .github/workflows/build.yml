name: blurhash

on: [ push ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: browser-actions/setup-firefox@latest
      - uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: '17'

      - uses: actions/setup-node@v7

      - name: Maven cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-lein-${{ hashFiles('project.clj') }}
          restore-keys: |
            ${{ runner.os }}-lein-

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v5
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - uses: browser-actions/setup-chrome@latest
      - name: Set environment
        run: |
          VERSION_NUMBER=$([ "${GITHUB_REF_NAME}" == "master" ] && echo "1.2.${GITHUB_RUN_NUMBER}" || echo "0.2.${GITHUB_RUN_NUMBER}-${GITHUB_REF_NAME//\//-}")
          echo "VERSION_NUMBER=$VERSION_NUMBER"
          echo "STATIC_DIR=static" >> $GITHUB_ENV
          echo "VERSION_NUMBER=$VERSION_NUMBER" >> $GITHUB_ENV

      - name: Preparation for build
        run: |
          sudo chown root /opt/google/chrome/chrome-sandbox
          sudo chmod 4755 /opt/google/chrome/chrome-sandbox
          node -v
          yarn install --ignore-engines --frozen-lockfile

      - name: Install Clojure tools
        uses: DeLaGuardo/setup-clojure@13.4

      - name: Run Clojure tests
        run: |
          lein test

      - name: Run ClojureScript tests on Node.js
        run: |
          lein test-node once

      - name: Run ClojureScript tests on the browser
        run: |
          lein doo browsers once

      # - name: Build the application
      #   run: |
      #     lein figwheel:dist
